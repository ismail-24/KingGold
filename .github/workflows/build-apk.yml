name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ]; then
            SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Existing Release Keystore and Print Fingerprints
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Signing passwords are missing."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Validating existing keystore..."

          keytool -list -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" > /dev/null

          echo "=== EXISTING KEYSTORE FINGERPRINTS ==="

          keytool -list -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload

      - name: Create google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "Error: GOOGLE_SERVICES_JSON_BASE64 is not set!"
            exit 1
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
    
      - name: Verify APK Signature Matches Keystore
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          KEY_SHA1=$(keytool -list -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload |
            awk -F': ' '/SHA1:/ {print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')

          APK_SHA1=$("$APKSIGNER" verify --print-certs "$APK" |
            awk -F': ' '/certificate SHA-1 digest:/ {print $2; exit}' |
            tr -d ':' | tr '[:lower:]' '[:upper:]')

          echo "Keystore SHA-1: $KEY_SHA1"
          echo "APK SHA-1:      $APK_SHA1"

          if [ -z "$KEY_SHA1" ] || [ "$KEY_SHA1" != "$APK_SHA1" ]; then
            echo "ERROR: APK signature does not match the existing keystore!"
            exit 1
          fi

          echo "SUCCESS: APK is signed with the expected keystore."
          
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: king-gold-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
